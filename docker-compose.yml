version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: campusconnect-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: campusconnect
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: campusconnect-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: campusconnect
      DB_SSL: "false"
      JWT_SECRET: super_jwt_secret_key_12345
      FRONTEND_URL: http://localhost
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: campusconnect-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
